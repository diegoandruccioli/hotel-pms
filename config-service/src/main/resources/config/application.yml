# Shared configuration inherited by ALL microservices via Spring Cloud Config.
# Service-specific overrides live in their own {service-name}.yml files.

spring:
  data:
    redis:
      # Finding #13 (security-report.md, MEDIUM): redis had no requirepass/ACL.
      # One shared property instead of repeating it in all 7 per-service ymls
      # that connect to Redis (api-gateway rate limiter, every other service's
      # InternalAuthFilter nonce store). Empty default so a service started
      # without INTERNAL_REDIS_PASSWORD fails the same way POSTGRES_PASSWORD
      # already does — no silent fallback to an unauthenticated connection.
      password: ${INTERNAL_REDIS_PASSWORD:}

logging:
  pattern:
    # CWE-117 log injection: the gateway's CorrelationIdFilter allowlists
    # X-Correlation-ID before it reaches MDC, but this is a second, structural
    # layer for every service that has no logback-spring.xml of its own
    # (api-gateway, config-service, guest-service, frontdesk-service,
    # fb-service) — same %replace wrapping already applied in auth-service's,
    # billing-service's and notification-service's logback-spring.xml.
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%replace(%X{correlationId:-}){'[\\r\\n]','_'}] %logger{36} - %replace(%msg){'[\\r\\n]','_'}%n"

management:
  metrics:
    distribution:
      # Enable histogram buckets for HTTP requests so Prometheus can compute
      # histogram_quantile() for P99 latency alerts (alert_rules.yml).
      percentiles-histogram:
        http:
          server:
            requests: true
      # Publish P50/P95/P99 percentiles in addition to the histogram.
      percentiles:
        http:
          server:
            requests: [0.5, 0.95, 0.99]
