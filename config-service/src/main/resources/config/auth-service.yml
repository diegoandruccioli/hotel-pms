server:
  port: 8087

jwt:
  secret: "${JWT_SECRET}"
  expiration: "${JWT_EXPIRATION:900000}"               # 15 minutes (T-AUTH-04)
  refresh-expiration: "${JWT_REFRESH_EXPIRATION:604800000}"  # 7 days

auth:
  # Opt-in seed of the second-tenant ADMIN fixture used only by the local
  # live E2E suite (frontend/e2e-live). Default false everywhere — leave
  # false on any installation with real hotel data. See E2eFixtureSeeder.
  seed-e2e-fixtures: "${AUTH_SEED_E2E_FIXTURES:false}"

spring:
  data:
    redis:
      host: "${AUTH_REDIS_HOST:redis}"
      port: 6379

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          # Redis is a hard dependency (rate limiter / nonce store / token blacklist): a lost
          # connection must show in readiness. Liveness stays Redis-free on purpose, so an
          # outage never makes a service look like it needs a restart.
          include: readinessState,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans
