server:
  port: 8085

application:
  config:
    # frontdesk-service consolidates the former inventory/reservation/stay
    # services (ADR-001, backup/DECISIONS.md). HotelSettingsClient still
    # reads from the stays-domain path (/api/v1/stays/settings) on it.
    frontdesk-service-url: http://frontdesk-service:8081
    # GuestClient pinned URL (BUG-0b) — Eureka is disabled cluster-wide, so a
    # bare @FeignClient(name = "guest-service") always failed with "No servers
    # available", silently falling back (PDF invoices showed "Unknown Guest").
    guest-service-url: http://guest-service:8083

resilience4j:
  circuitbreaker:
    instances:
      # Previously unconfigured — all three Feign clients above ran on
      # Resilience4j's hard-coded defaults, with no health-indicator exposure,
      # so an open circuit was invisible in actuator health and its fallback
      # (silent zero/placeholder data) was indistinguishable from a genuine
      # zero from the upstream service. Found via the KPI report showing
      # all-zero ADR/RevPAR/occupancy with correct revenue alongside it
      # (live QA, 2026-09) — see FrontdeskRoomsClient's fallback logging.
      hotelSettingsService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
      guestService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
      frontdeskOccupancy:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

internal:
  hmac:
    secret: ${INTERNAL_HMAC_SECRET}

spring:
  data:
    redis:
      # Nonce store for internal HMAC anti-replay (T-GW-08). Same Redis
      # instance used by api-gateway for rate limiting, on a separate
      # key namespace (internal-auth:nonce:*).
      host: ${INTERNAL_REDIS_HOST:redis}
      port: ${INTERNAL_REDIS_PORT:6379}

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
