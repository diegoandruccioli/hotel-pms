server:
  port: 8086

internal:
  hmac:
    secret: ${INTERNAL_HMAC_SECRET}

spring:
  data:
    redis:
      # Nonce store for internal HMAC anti-replay (T-GW-08). Same Redis
      # instance used by api-gateway for rate limiting, on a separate
      # key namespace (internal-auth:nonce:*).
      host: ${INTERNAL_REDIS_HOST:redis}
      port: ${INTERNAL_REDIS_PORT:6379}

resilience4j:
  circuitbreaker:
    instances:
      billingService:
        # A legitimate 4xx rejection from billing-service (e.g. 409
        # INVOICE_LOCKED_AFTER_EXPORT) is a real business conflict, not
        # downstream unavailability — it must never be recorded as a circuit-
        # breaker failure nor trigger addChargeFallback, or the caller can
        # never distinguish "billing-service is down" from "billing-service
        # said no" (round 1 bug #1). FeignClientException groups every 4xx
        # Feign exception; ignoring it here means those propagate as real
        # exceptions instead, while genuine outages (5xx/timeout, in
        # FeignServerException/RetryableException) still hit the fallback.
        ignoreExceptions:
          - feign.FeignException$FeignClientException

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
