server:
  port: 8083

application:
  config:
    # frontdesk-service consolidates the former inventory/reservation/stay
    # services (ADR-001, backup/DECISIONS.md) — one URL now covers both the
    # StayServiceClient and ReservationClient Feign clients in guest-service.
    frontdesk-service-url: http://frontdesk-service:8081
    billing-service-url: http://billing-service:8085

internal:
  hmac:
    secret: ${INTERNAL_HMAC_SECRET}

spring:
  data:
    redis:
      # Nonce store for internal HMAC anti-replay (T-GW-08). Same Redis
      # instance used by api-gateway for rate limiting, on a separate
      # key namespace (internal-auth:nonce:*).
      host: ${INTERNAL_REDIS_HOST:redis}
      port: ${INTERNAL_REDIS_PORT:6379}

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

guest:
  retention:
    # GDPR anonymization job (T-GST-05). Was hardcoded in the
    # @Scheduled annotation; externalized here for the same reason as
    # frontdesk.night-audit.cron — movable without a redeploy.
    cron: "0 0 2 * * *"
  documents:
    # Encrypts identity_documents.document_number at rest (E23, GDPR Art. 32)
    # via DocumentNumberConverter, AES-256-GCM — same pattern as frontdesk-
    # service's alloggiati.credentials.encryption-key/-salt.
    # encryption-salt MUST be hex-encoded (e.g. `openssl rand -hex 16`).
    encryption-key: ${GUEST_DOCUMENTS_ENCRYPTION_KEY}
    encryption-salt: ${GUEST_DOCUMENTS_ENCRYPTION_SALT}
