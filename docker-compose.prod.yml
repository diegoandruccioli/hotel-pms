# ============================================================
# Hotel PMS – Production port-hardening override
# ============================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#          --profile observability up -d
# The --profile flag is required here: docker-compose.yml gates
# loki/grafana/zipkin/alertmanager/prometheus ("observability") behind an
# opt-in profile for a leaner dev default. An override file only changes
# settings for services already selected — it does NOT re-enable a
# profile-gated service. Omitting this flag in production would silently
# drop monitoring, not just harden ports. (WAL archiving + local pgBackRest
# backups are part of the always-on postgres service, not profile-gated —
# see docker-compose.yml.)
#
# Removes host port publishing for every service except the two
# meant to be reachable from outside the host: frontend (:80) and
# api-gateway (:8080). All other services (Postgres, Redis, Loki,
# Grafana, Zipkin, Alertmanager, Prometheus, config-server, and every
# backend microservice incl. notification-service) stay reachable on
# the internal compose networks — inter-container DNS resolution does
# not depend on host port publishing — but are no longer bound to the
# host's network interface. OWASP A05 — Security Misconfiguration
# (ROADMAP P0). New services (e.g. Alertmanager/P4, notification-service/C1)
# must be added here too, or they leak onto the host in "production".
# ============================================================

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  loki:
    ports: !reset []

  grafana:
    ports: !reset []

  zipkin:
    ports: !reset []

  prometheus:
    ports: !reset []

  config-server:
    ports: !reset []

  auth-service:
    ports: !reset []

  guest-service:
    ports: !reset []

  frontdesk-service:
    ports: !reset []

  billing-service:
    ports: !reset []

  fb-service:
    ports: !reset []

  notification-service:
    ports: !reset []

  alertmanager:
    ports: !reset []
