groups:

  # ----------------------------------------------------------------
  # Availability — service reachability and HTTP error rate
  # ----------------------------------------------------------------
  - name: hotel_pms_availability
    interval: 30s
    rules:

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
          description: >
            Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }}).
            The service has been unreachable for more than 1 minute.

      - alert: HighErrorRate
        expr: |
          (
            sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            sum by (job) (rate(http_server_requests_seconds_count[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on {{ $labels.job }}"
          description: >
            5xx error rate has exceeded 5% for more than 2 minutes on {{ $labels.job }}.
            Current value: {{ $value | humanizePercentage }}.

      # Requires management.metrics.distribution.percentiles-histogram.http.server.requests=true
      # (configured in shared config/application.yml)
      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum by (job, le) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P99 latency on {{ $labels.job }}"
          description: >
            P99 HTTP request latency exceeds 2 s for 5+ minutes on {{ $labels.job }}.
            Current P99: {{ $value | humanizeDuration }}.

  # ----------------------------------------------------------------
  # JVM — heap and GC pressure
  # ----------------------------------------------------------------
  - name: hotel_pms_jvm
    interval: 60s
    rules:

      - alert: JvmHeapHigh
        expr: |
          (
            jvm_memory_used_bytes{area="heap"}
            /
            jvm_memory_max_bytes{area="heap"}
          ) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap usage on {{ $labels.job }}"
          description: >
            JVM heap usage exceeds 85% for 5+ minutes on {{ $labels.job }}.
            Current usage: {{ $value | humanizePercentage }}.

  # ----------------------------------------------------------------
  # Resilience4j — circuit breakers
  # ----------------------------------------------------------------
  - name: hotel_pms_resilience
    interval: 30s
    rules:

      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker OPEN on {{ $labels.job }}"
          description: >
            Circuit breaker '{{ $labels.name }}' is OPEN on {{ $labels.job }}.
            All downstream calls through this breaker are currently failing fast.

  # ----------------------------------------------------------------
  # Database — HikariCP connection pool
  # ----------------------------------------------------------------
  - name: hotel_pms_database
    interval: 30s
    rules:

      - alert: DbConnectionPoolNearExhaustion
        expr: |
          (
            hikaricp_connections_active
            /
            hikaricp_connections_max
          ) > 0.90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "DB connection pool near exhaustion on {{ $labels.job }}"
          description: >
            HikariCP active connections exceed 90% of the pool max for 2+ minutes
            on {{ $labels.job }}. Current utilisation: {{ $value | humanizePercentage }}.

      - alert: PostgresDown
        expr: pg_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Postgres is unreachable from postgres-exporter"
          description: >
            postgres-exporter cannot connect to the database. Distinct from
            ServiceDown (which only proves postgres-exporter itself answers
            scrapes) — this is the database connection actually failing.

  # ----------------------------------------------------------------
  # Host — single-PC deployment has no infra monitoring otherwise; a full
  # disk or a dead backup loop previously failed silently.
  # ----------------------------------------------------------------
  - name: hotel_pms_host
    interval: 60s
    rules:

      - alert: DiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
          ) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.mountpoint }}"
          description: >
            {{ $labels.mountpoint }} has less than 15% free space for 10+ minutes.
            Current free: {{ $value | humanizePercentage }}. On a single-PC
            deployment this is the most likely way the whole pilot stops.

      - alert: BackupHeartbeatStale
        expr: time() - pgbackrest_scheduler_heartbeat_timestamp_seconds > 93600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backup scheduler loop has not made progress in 26h+"
          description: >
            backup-scheduler.sh's own heartbeat is stale — the loop is either
            dead (should have been auto-restarted by entrypoint-wrapper.sh's
            supervisor; check hotel_postgres container logs) or hung mid-cycle.

      - alert: BackupNotSucceededRecently
        expr: time() - pgbackrest_last_successful_backup_timestamp_seconds > 93600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No fully successful pgBackRest cycle in the last 26h+"
          description: >
            Every configured repo (local repo1, and off-site repo2 if
            S3_BUCKET is set) succeeding together is what clears this metric —
            see BackupCycleFailed alerts / hotel_postgres logs for which one
            is failing.
