global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "config-server"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["config-server:8090"]

  - job_name: "api-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8090"]

  - job_name: "auth-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8090"]

  - job_name: "guest-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["guest-service:8090"]

  - job_name: "frontdesk-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["frontdesk-service:8090"]

  - job_name: "billing-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["billing-service:8090"]

  - job_name: "fb-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["fb-service:8090"]

  - job_name: "notification-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8090"]

  # Host-level metrics (disk space, CPU, memory) — the single PC running
  # this stack has no infra monitoring otherwise. Disk full is the most
  # likely failure mode on a one-machine pilot and was previously invisible.
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Postgres-internal metrics (connections, replication lag, table/index
  # bloat) — the 8 Spring Boot jobs above only see the JVM side (HikariCP
  # pool usage), never the database process itself.
  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
