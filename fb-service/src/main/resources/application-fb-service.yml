server:
  port: 8086

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hotel_fb
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        # Local-file leftover: this was "*" (every actuator endpoint, incl.
        # /actuator/env and /actuator/heapdump) while config-service already
        # serves the correct restricted value for fb-service — aligned here so
        # both property sources agree regardless of which one wins at runtime.
        include: "prometheus,health,info"
  endpoint:
    health:
      show-details: when-authorized


# Internal HMAC security - injected by setup-hmac-secret script
internal:
  hmac:
    secret: ${INTERNAL_HMAC_SECRET}
